<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Yoru · Offline</title>
    <style>
      body {
        background: #0d0d14;
        color: #f5f3ff;
        font: 17px system-ui;
        display: grid;
        place-content: center;
        min-height: 90vh;
        padding: 24px;
      }
      main {
        max-width: 440px;
      }
      img {
        width: 64px;
      }
      p {
        color: #aba7bd;
        line-height: 1.7;
      }
      a {
        color: #bca6ff;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="Yoru" />
      <h1>A small intermission.</h1>
      <p>
        You're offline. Reconnect to browse your library and catch up with the community. Your saved
        progress is safe on the server.
      </p>
      <a href="/">Try again →</a>
    </main>
  </body>
</html>
